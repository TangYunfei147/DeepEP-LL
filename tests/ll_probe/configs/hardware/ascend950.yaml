# 本文件是程序实际加载的硬件模型。
# 白皮书原始规格、出处和未启用参数模板：ascend950.reference.yaml（不加载、不参与计算）。
# 修改本文件后，各节点须使用相同内容；报告会保存快照与hash。

# 一、运行元信息：用于格式校验和报告显示，不代入理论耗时公式。
schema_version: 1
label: Ascend 950 Unified Bus ideal chip endpoint bound (not measured pair bandwidth)

# 二、当前启用的计算参数：全部为单向、十进制GB/s（1GB=10^9字节）。
# 1008=白皮书整芯片双向2016/2；仅为理想整芯片端点上限，不是单对卡实测峰值。
# 默认一rank对应整颗芯片；如果仅使用部分资源，按实际可用容量修改。
# 理论耗时取各已启用资源的bytes/(GB/s*1000)最大值，单位微秒。
# 参考利用率=理论耗时/实测耗时*100%，未包含启动、协议、缓存和拥塞开销。
# 未填写的链路/主机/fabric限制属于未知，不是无限带宽；可从reference文件复制后启用。
model:
  # 每个rank全部发送边共享的总出口；按最大rank发送量计算发送侧下界。
  per_rank_tx_GBps: 1008
  # 每个rank全部接收边共享的总入口；按最大rank接收量计算接收侧下界。
  per_rank_rx_GBps: 1008
