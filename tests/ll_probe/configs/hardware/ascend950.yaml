# 配置格式版本；通常无需修改。
schema_version: 1
# 报告中显示的参考模型名称，不代表目标机器的实测链路峰值。
label: Ascend 950 Unified Bus ideal chip endpoint bound (not measured pair bandwidth)
# 白皮书出处，仅用于追溯；修改实际机器参数时建议保留原始出处。
source:
  title: 昇腾950 NPU架构白皮书
  url: https://public-download.obs.cn-east-2.myhuaweicloud.com/ascend/%E6%98%87%E8%85%BE950%20NPU%E6%9E%B6%E6%9E%84%E7%99%BD%E7%9A%AE%E4%B9%A6.pdf
  # 原始PDF文件的SHA256，不是本YAML文件的hash。
  sha256: ece3405e6a17fabdd462338fb94266558649a6407a2f28008403211387b3a927
  # PDF阅读器中的页码，从1开始；与正文印刷页码可能不同。
  pdf_pages_1_based: [15, 30, 31]
  sections: ["规格表", "4.6互连子系统", "4.6.2 UBoE"]
# 白皮书原始规格，仅作参考记录；统计计算实际使用下方model。
# GBps表示GB/s（字节/秒），Gbps表示Gbit/s（比特/秒）；1字节=8比特。
# 此处GB采用十进制：1GB=10^9字节，不是GiB。
whitepaper_reference:
  # 整颗芯片UB收发双向合计峰值，不能直接当作单向或单对卡带宽。
  unified_bus_chip_bidirectional_GBps: 2016
  # 整颗芯片的UB端口数量，不是每对卡之间的端口数。
  unified_bus_ports: 18
  # 每个满配UB端口的物理lane数量；实际端口可能降为x2或x1。
  lanes_per_port: 4
  # 单lane的标称比特速率；与上面的GB/s字段注意区分单位。
  serdes_lane_Gbps: 112
  # 整芯片UBoE双向合计峰值；不意味着当前MTE路径采用UBoE。
  uboe_chip_bidirectional_GBps: 200
  # UBoE端口数，与UB端口复用，不能把两者峰值相加。
  uboe_ports: 2
  # 每个UBoE端口的标称比特速率，实际光模块/组网可能更低。
  uboe_port_Gbps: 400
  # PCIe 5.0 x16双向合计峰值，不自动作为NPU间通信的参考。
  pcie5_x16_bidirectional_GBps: 128
# 实际参与理论耗时计算的容量配置，全部使用“单向、十进制GB/s”。
# 默认1008=2016/2，是理想整芯片收发上限，不保证单对卡能达到。
# 如果一个rank只使用芯片的部分资源，应按实际可用容量调整，不能沿用整芯片值。
# 不自动推断PR/DT型号、布线、光模块速率或实际路由。
# null表示该约束未知、不纳入计算；不是0带宽，也不是实际链路无限快。
# 修改为已知的正数即可启用约束，例如确认单对卡只有一个满速x4端口时可填56。
# 理论耗时=max(各资源实际承担的字节数/(对应GB/s*1000))，单位为微秒。
# 参考利用率=理论耗时/实测耗时*100%，因此默认结果仅相对于理想容量下界。
# 报告保存此文件的内容快照与hash；同一次多机测试，各节点须使用相同配置。
model:
  # 每个rank所有发送边共享的单向总出口容量；默认按一rank对应整颗芯片估算。
  per_rank_tx_GBps: 1008
  # 每个rank所有接收边共享的单向总入口容量；不是每条接收边各有1008GB/s。
  per_rank_rx_GBps: 1008
  # 同一主机内每条src→dst有向边的容量；已知实际单对卡链路后填写。
  intra_host_pair_GBps: null
  # 不同主机间每条src→dst有向边的容量；按实际链路/光模块填写，不猜测。
  inter_host_pair_GBps: null
  # 每台主机所有跨机发送边共享的总出口容量；不是每卡或每对卡容量。
  per_host_cross_tx_GBps: null
  # 每台主机所有跨机接收边共享的总入口容量；用于表达共享入口瓶颈。
  per_host_cross_rx_GBps: null
  # 整个作业全部发送边共享的fabric总容量；只有存在明确全局共享瓶颈时填写。
  aggregate_GBps: null
notes:
  - 出框速率受光模块限制；本配置不是目标机器实际链路峰值证明。
  - null表示未提供该约束，不从单芯片峰值猜测单对卡或跨机共享带宽。
  - 如单对卡明确使用一个满速x4端口，56GB/s可由4*112/8推导；确认拓扑后再填写，默认不采用。
  - 理论时间取各有效资源字节数/单向容量的最大值，不计算启动、协议、缓存和拥塞开销。
